<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pairwise Voting</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/script.js" defer></script>
</head>
<body>
  <main>
    <h1>Choose which option matters more when selecting a college to attend.</h1>
    <div id="pair" class="pair">
      <button id="left" class="choice">Loading…</button>
      <div class="vs">vs</div>
      <button id="right" class="choice">Loading…</button>
    </div>
    <div class="controls">
      <button id="skip">Skip</button>
      <button id="quit">Quit and Save</button>
      <span id="status"></span>
    </div>
  </main>
</body>
</html>
